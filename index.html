<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  <meta name="description" content="다섯 명의 취향, 하나의 여행. 함께 후보를 모으고 투표하는 오사카 여행 보드.">
  <title>Trip Together — 우리들의 오사카</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%230064ff'/%3E%3Cpath d='M12 15h24M24 15v21' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

/* Original, Toss-inspired interface. No Toss assets or TDS runtime required. */
:root {
  color-scheme: light;
  --blue: #0064ff;
  --blue-dark: #0052d4;
  --blue-soft: #e8f3ff;
  --blue-text: #195acb;
  --paper: #f2f4f6;
  --white: #fff;
  --ink: #191f28;
  --muted: #6b7684;
  --secondary: #4e5968;
  --line: #e5e8eb;
  --subtle: #f9fafb;
  --red: #d5283c;
  --radius: 24px;
  --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--font); word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
body:has(dialog[open]) { overflow: hidden; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { touch-action: manipulation; }
button { cursor: pointer; color: inherit; border: 0; background: none; }
button, a { -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, summary:focus-visible, .import-label:focus-within { outline: 3px solid var(--blue); outline-offset: 4px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
h1, h2, h3, h4, p { margin: 0; }
small { font-size: 12px; }
svg { flex-shrink: 0; }
img { display: block; max-width: 100%; }
img[hidden] { display: none; }
.icon { display: inline-block; width: 22px; height: 22px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 17px; height: 17px; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.skip-link { position: fixed; top: -100px; left: 16px; z-index: 999; background: white; padding: 14px; border-radius: 12px; }
.skip-link:focus { top: 12px; }
.eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: -.2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 12px 18px; border: 1px solid transparent; border-radius: 14px; font-size: 14px; line-height: 1.5; font-weight: 600; transition: background .16s, transform .16s; }
.btn:active:not(:disabled), .date-tab:active, .slot-add:active, .nav-add:active { transform: scale(.98); }
.btn.primary { background: var(--blue); color: white; }
.btn.primary:hover { background: var(--blue-dark); }
.btn.secondary { background: var(--paper); color: var(--secondary); }
.btn.secondary:hover { background: var(--line); }
.btn.soft { background: var(--blue-soft); color: var(--blue-text); }
.btn.ghost { color: var(--muted); }
.btn.danger { background: #ffeeee; color: var(--red); }
.btn.small { min-height: 44px; padding: 10px 14px; font-size: 13px; }
.btn.full { width: 100%; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; color: var(--muted); }
.icon-btn:hover { background: var(--paper); }
.text-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; color: var(--blue-text); font-size: 13px; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-text); font-size: 12px; font-weight: 600; line-height: 1.6; white-space: nowrap; }
.badge.orange { color: #a45409; background: #fff3e0; }
.badge.gray { color: var(--muted); background: var(--paper); }
.badge.star { color: #926500; background: #fff5d6; }
.badge.outline { background: transparent; border: 1px solid var(--line); }

/* App shell */
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; flex-direction: column; width: 232px; padding: 34px 22px 28px; background: white; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-symbol { display: grid; place-items: center; width: 35px; height: 35px; flex-shrink: 0; border-radius: 12px; background: var(--blue); color: white; }
.brand-symbol .icon { width: 22px; height: 22px; }
.brand-name { font-size: 18px; font-weight: 800; line-height: 1.4; letter-spacing: -.7px; white-space: nowrap; }
.brand-sub { display: none; }
.sidebar-trip { margin: 34px 0 22px; padding: 18px; border-radius: 20px; background: var(--subtle); }
.sidebar-trip .eyebrow { font-size: 12px; color: var(--blue-text); }
.sidebar-trip h2 { margin: 6px 0; font-size: 18px; letter-spacing: -.5px; }
.sidebar-trip p { color: var(--muted); font-size: 12px; }
.side-nav { display: grid; gap: 5px; }
.side-nav button { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 14px; border-radius: 16px; color: var(--muted); font-size: 14px; text-align: left; }
.side-nav button.active { color: var(--blue); background: var(--blue-soft); font-weight: 700; }
.side-nav button:not(.active):hover { background: var(--subtle); }
.side-nav .nav-count { margin-left: auto; font-size: 12px; }
.sidebar-bottom { margin-top: auto; padding-top: 30px; }
.side-note { padding: 18px; border-radius: 18px; background: var(--subtle); color: var(--muted); font-size: 12px; line-height: 1.8; }
.side-note .icon { margin-bottom: 8px; color: var(--blue); }
.side-note strong { display: block; margin-bottom: 6px; color: var(--secondary); font-size: 13px; }
.side-footer { margin: 20px 4px 0; color: var(--muted); font-size: 11px; }
.app-main { max-width: 1490px; margin-left: 232px; padding: 0 40px 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 86px; }
.breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.breadcrumb b { color: var(--secondary); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.profile-btn { display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 5px 10px 5px 5px; border-radius: 24px; background: white; font-size: 13px; flex-shrink: 0; }
.profile-name { max-width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 2px solid white; border-radius: 50%; background: #e8f3ff; color: #195acb; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.avatar.p2 { background: #f0e9ff; color: #7550b7; }
.avatar.p3 { background: #dff7ee; color: #16816a; }
.avatar.p4 { background: #ffeddf; color: #ac5b24; }
.avatar.p5 { background: #ffedf3; color: #b44773; }
.avatar-stack { display: flex; padding-left: 7px; }
.avatar-stack .avatar { width: 34px; height: 34px; margin-left: -7px; }
.mobile-brand { display: none; }
.local-notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; color: var(--muted); font-size: 12px; }
.local-notice > span { display: flex; align-items: center; gap: 6px; }
.local-notice .icon { width: 15px; height: 15px; }
.local-notice .text-btn { min-height: 36px; font-size: 12px; color: var(--secondary); flex-shrink: 0; }
.demo-notice, .storage-notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 18px; padding: 14px 18px; border-radius: 16px; background: #fff4de; color: #895712; font-size: 12px; }
.demo-notice .text-btn { flex-shrink: 0; color: #895712; font-size: 12px; }
.storage-notice { color: #a62b3d; background: #ffeeee; }

/* Home: a compact travel summary, not a promotional poster. */
.hero { position: relative; margin: 0 0 24px; padding: 28px 32px 20px; overflow: hidden; border-radius: var(--radius); background: white; }
.hero-main { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.hero-copy { min-width: 0; }
.hero .eyebrow { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; font-size: 13px; color: var(--secondary); }
.hero .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.hero h1 { font-size: 31px; font-weight: 700; line-height: 1.4; letter-spacing: -1.2px; }
.hero h1 span { color: var(--blue); }
.hero-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; color: var(--muted); font-size: 13px; }
.hero-meta .icon { width: 16px; height: 16px; }
.hero-meta .dot { width: 3px; height: 3px; background: #b0b8c1; border-radius: 50%; }
.hero-footer { display: flex; align-items: center; gap: 24px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--paper); }
.hero-stat { font-size: 12px; color: var(--muted); }
.hero-stat b { display: block; margin-top: 1px; color: var(--ink); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero-stat b span { font-size: 13px; font-weight: 500; }
.hero-footer .text-btn { margin-left: auto; }
.hero-art { position: relative; width: 154px; height: 145px; flex-shrink: 0; margin-right: 20px; }
.trip-orbit { position: absolute; inset: 6px 0 0; border-radius: 50%; background: #f0f6ff; }
.trip-case { position: absolute; left: 32px; top: 29px; width: 83px; height: 104px; border-radius: 21px; background: linear-gradient(135deg,#77b7ff,#3182f6 60%,#0064ff); box-shadow: inset -6px -5px 10px #005bd42b, inset 3px 3px 6px #ffffff66, 5px 12px 18px #0064ff1c; transform: rotate(-12deg); }
.case-handle { position: absolute; top: -13px; left: 25px; width: 33px; height: 20px; border: 6px solid #6b7684; border-bottom: 0; border-radius: 10px 10px 0 0; z-index: -1; }
.case-line { position: absolute; left: 19px; top: 17px; bottom: 16px; width: 5px; border-radius: 9px; background: #ffffff35; box-shadow: 1px 0 1px #005bd41c; }
.case-line + .case-line { left: auto; right: 18px; }
.trip-case::before, .trip-case::after { content: ''; position: absolute; width: 11px; height: 10px; bottom: -5px; border-radius: 4px; background: #4e5968; z-index: -1; }
.trip-case::before { left: 14px; }
.trip-case::after { right: 14px; }
.case-sticker { position: absolute; left: 23px; top: 36px; display: grid; place-items: center; width: 39px; height: 34px; border-radius: 9px; background: white; color: var(--blue); transform: rotate(7deg); }
.case-sticker .icon { width: 23px; height: 23px; }
.case-pin { position: absolute; top: 8px; right: 0; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 16px; color: var(--blue); background: white; box-shadow: 0 5px 16px #193c6210; transform: rotate(10deg); }
.case-pin .icon { width: 25px; height: 25px; }
.case-check { position: absolute; right: 9px; bottom: 2px; display: grid; place-items: center; width: 30px; height: 30px; border: 3px solid white; border-radius: 50%; background: #29b784; color: white; }
.case-check .icon { width: 18px; height: 18px; stroke-width: 2.8; }

/* Dates and timeline */
.date-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 0 28px; }
.date-tabs { display: flex; gap: 6px; padding: 5px; border-radius: 19px; background: white; }
.date-tab { position: relative; min-width: 120px; padding: 10px 17px; border-radius: 14px; color: var(--secondary); text-align: left; transition: background .16s, color .16s; }
.date-tab:hover:not(.active) { background: var(--subtle); }
.date-tab .day { font-size: 12px; color: var(--muted); font-weight: 500; }
.date-tab .date { display: flex; align-items: baseline; gap: 7px; font-size: 22px; font-weight: 700; line-height: 1.6; letter-spacing: -.7px; font-variant-numeric: tabular-nums; }
.date-tab .date span { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; }
.date-tab.active { color: white; background: var(--blue); }
.date-tab.active .day, .date-tab.active .date span { color: #fff; }
.date-tab .tab-dot { position: absolute; top: 13px; right: 12px; width: 6px; height: 6px; background: #b0b8c1; border-radius: 50%; }
.date-tab.active .tab-dot { background: white; }
.date-extra { color: var(--muted); font-size: 12px; text-align: right; }
.date-extra .members { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.board-layout { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 24px; align-items: start; }
.board-content, .board-aside { min-width: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.section-head h2 { font-size: 23px; letter-spacing: -.7px; }
.section-head p { margin-top: 5px; color: var(--muted); font-size: 13px; }
.section-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.section-head .btn { min-height: 44px; padding: 9px 12px; background: white; font-size: 12px; }
.period { padding: 8px 20px 0; margin-bottom: 16px; border-radius: var(--radius); background: white; }
.period-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0; padding: 17px 0 9px; color: var(--ink); font-size: 18px; font-weight: 700; }
.period-title span { color: var(--muted); font-size: 12px; font-weight: 400; }
.slot { border-top: 1px solid var(--paper); }
.period-title + .slot { border-top: 0; }
.slot-summary { display: flex; align-items: center; gap: 12px; padding: 20px 0; }
.slot-glyph { display: grid; place-items: center; flex-shrink: 0; width: 46px; height: 46px; border-radius: 17px; background: #fff8e7; font-size: 24px; }
.slot-glyph.pm { background: #edf5ff; }
.slot-glyph.night { background: #f0edff; }
.slot-label { flex: 1; min-width: 0; min-height: 48px; padding: 0; text-align: left; }
.slot-label h3 { display: flex; align-items: baseline; gap: 3px 8px; flex-wrap: wrap; font-size: 16px; font-weight: 600; line-height: 1.55; }
.slot-label .time { font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.slot-label p { margin-top: 4px; color: var(--muted); font-size: 12px; }
.slot-preview { color: var(--blue-text) !important; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.slot-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.slot-right .badge { font-size: 11px; padding: 3px 7px; }
.slot-right .icon-btn { width: 36px; }
.slot-add { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 15px; background: var(--blue-soft); color: var(--blue); flex-shrink: 0; }
.slot-add:hover { background: #d9ebff; }
.slot-body { padding: 0 0 20px; }
.slot-body .btn.full { margin-top: 16px; color: var(--blue-text); background: var(--blue-soft); }
.empty-slot { padding: 22px 6px; text-align: center; color: var(--muted); font-size: 13px; }
.candidate { padding: 20px 0; border-bottom: 1px solid var(--paper); }
.candidate:last-child { border-bottom: 0; padding-bottom: 0; }
.candidate-head { display: flex; align-items: flex-start; gap: 12px; }
.category-art { position: relative; display: grid; place-items: center; flex-shrink: 0; overflow: hidden; width: 56px; height: 56px; border-radius: 18px; color: #b77609; background: #fff4d9; }
.category-art .icon { width: 28px; height: 28px; }
.category-art.sight, .category-art.other { color: #3976ce; background: #e8f3ff; }
.category-art.cafe, .category-art.meal { color: #bd773a; background: #fff0df; }
.category-art.night, .category-art.drink { color: #8962ce; background: #f1eafe; }
.category-art.shopping { color: #d66080; background: #fff0f5; }
.category-art.activity { color: #208f79; background: #e5f6ef; }
.category-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.candidate-main { flex: 1; min-width: 0; }
.candidate-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
.rank { color: var(--blue-text); font-weight: 700; }
.rank.rank2, .rank.rank3 { color: var(--secondary); }
.candidate-title { padding: 0; color: var(--ink); font-size: 17px; font-weight: 700; line-height: 1.55; letter-spacing: -.4px; text-align: left; overflow-wrap: anywhere; }
.candidate-title:hover { color: var(--blue); }
.candidate-desc { display: -webkit-box; margin-top: 5px; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--muted); font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
.candidate-facts { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 10px; margin-top: 8px; color: var(--muted); font-size: 12px; }
.candidate-facts span { display: inline-flex; align-items: center; gap: 4px; }
.candidate-facts .icon { width: 14px; height: 14px; }
.candidate-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
.vote-group { display: flex; align-items: center; gap: 6px; }
.vote-btn, .pick-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 9px 12px; border: 1px solid transparent; border-radius: 12px; color: var(--secondary); background: var(--paper); font-size: 13px; white-space: nowrap; transition: background .16s; }
.vote-btn:hover, .pick-btn:hover { background: var(--line); }
.vote-btn.selected { color: var(--blue-text); background: #dcecff; }
.vote-btn.selected .icon { fill: var(--blue); stroke: var(--blue); }
.pick-btn.selected { color: #956500; background: #fff1c2; }
.pick-btn.selected .icon { fill: #efb827; stroke: #c38b0f; }
.vote-btn .icon, .pick-btn .icon { width: 17px; height: 17px; }
.map-link { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; color: var(--secondary); font-size: 12px; }
.map-link .icon { width: 15px; height: 15px; }
.candidate-controls > .map-link .icon:last-child { display: none; }
.voter-names { margin-top: 10px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.pick-names { margin-top: 4px; color: #916412; font-size: 12px; overflow-wrap: anywhere; }
.confirmed-label { display: flex; align-items: center; gap: 5px; padding-top: 4px; color: var(--blue-text); font-size: 12px; font-weight: 600; }
.confirmed-label .icon { width: 15px; height: 15px; }
.confirmed-box { margin: 12px 0 20px; padding: 16px; border-radius: 18px; background: #f0f7ff; }
.confirmed-box .candidate { padding: 0; border: 0; }
.confirmed-box .vote-btn:not(.selected), .confirmed-box .pick-btn:not(.selected) { background: white; }
.rain-text { margin-top: 14px; padding-top: 9px; border-top: 1px solid #dbe9f7; color: var(--muted); font-size: 12px; }
.rain-text .text-btn { font-size: 12px; }
.other-label { margin-top: 12px; color: var(--muted); font-size: 13px; font-weight: 500; }
.other-candidates summary { min-height: 44px; padding: 12px 0; color: var(--secondary); font-size: 13px; cursor: pointer; }
.disabled-slots { padding: 14px; font-size: 13px; color: var(--muted); background: white; }
.aside-card { margin-bottom: 16px; padding: 24px; border-radius: var(--radius); background: white; }
.aside-card h3 { display: flex; align-items: center; gap: 7px; margin-bottom: 16px; font-size: 15px; font-weight: 600; }
.aside-card h3 .icon { width: 19px; height: 19px; color: var(--blue); }
.progress-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.progress-label strong { color: var(--ink); font-size: 29px; font-weight: 700; letter-spacing: -.8px; }
.progress-label strong span { color: var(--muted); font-size: 16px; font-weight: 400; }
.progress-track { height: 7px; margin: 12px 0 16px; overflow: hidden; border-radius: 20px; background: var(--paper); }
.progress-track > span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
.aside-stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 12px; }
.aside-stats b { color: var(--secondary); }
.budget-card { background: #e8f3ff; }
.budget-card h3 { color: var(--blue-text); }
.budget-amount { font-size: 30px; font-weight: 700; letter-spacing: -.9px; font-variant-numeric: tabular-nums; }
.budget-amount small { color: var(--secondary); font-size: 12px; font-weight: 400; }
.budget-note { margin-top: 10px; color: var(--secondary); font-size: 12px; line-height: 1.75; }
.booking-line { display: flex; align-items: center; gap: 11px; padding: 16px 0; border-top: 1px solid var(--paper); }
.booking-line:first-of-type { padding-top: 2px; border-top: 0; }
.booking-line:last-child { padding-bottom: 0; }
.booking-line > .icon { width: 28px; height: 28px; color: var(--blue); }
.booking-line > div { min-width: 0; flex: 1; }
.booking-line strong { display: block; color: var(--secondary); font-size: 14px; font-weight: 600; }

/* Forms and bottom sheets */
dialog { width: min(620px,calc(100% - 40px)); max-height: calc(100dvh - 56px); padding: 0; overflow: auto; overscroll-behavior: contain; border: 0; border-radius: 28px; background: white; color: var(--ink); box-shadow: 0 24px 100px #191f2829; }

.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }

.field textarea { min-height: 102px; resize: vertical; line-height: 1.75; }
.field input::placeholder, .field textarea::placeholder, .comment-form textarea::placeholder { color: #77818e; font-size: 14px; }

.input-action { display: flex; gap: 8px; }

.link-tools { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }

.advanced { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }

.info-box { margin-bottom: 22px; padding: 16px 18px; border-radius: 16px; color: var(--secondary); background: var(--subtle); font-size: 13px; line-height: 1.8; }

.participant-list { display: grid; gap: 8px; }

.subhead { margin: 28px 0 16px; font-size: 17px; font-weight: 600; }

.import-label { cursor: pointer; }
.detail-cover { position: relative; display: grid; place-items: center; height: 156px; margin-bottom: 22px; overflow: hidden; border-radius: 22px; color: #6aa4ed; background: #eff6ff; }

.toast { position: fixed; z-index: 9999; left: calc(50% + 116px); bottom: 28px; width: max-content; max-width: min(480px,90vw); padding: 14px 20px; border-radius: 16px; background: #333d4bf5; color: white; box-shadow: 0 4px 24px #191f281a; font-size: 14px; line-height: 1.7; opacity: 0; pointer-events: none; transform: translate(-50%,12px); transition: opacity .18s, transform .18s; }

<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div id="app"></div>
  <dialog id="panel-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><div id="confirm-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>이 여행 보드의 후보 등록과 투표 기능을 사용하려면 JavaScript를 켜주세요.</noscript>
  <script>/* Trip Together: dependency-free state model. */
(() => {
  'use strict';
  const SLOTS = [
    ['breakfast','아침식사','🍳','아침','08:00','09:00'],['morning','오전 일정','☀️','아침','09:00','12:00'],
    ['lunch','점심식사','🍜','낮','12:00','13:00'],['afternoon1','오후 일정 ①','🌤️','낮','13:00','15:00'],
    ['afternoon2','오후 일정 ②','☕','낮','15:00','18:00'],['dinner','저녁식사','🍽️','저녁','18:00','19:00'],
    ['evening1','저녁 일정 ①','🌙','저녁','19:00','21:00'],['evening2','저녁 일정 ②','✨','저녁','21:00','23:00']
  ].map(([id,label,icon,period,start,end])=>({id,label,icon,period,start,end}));
  const CATEGORIES = {meal:'식사',cafe:'카페',sight:'관광',shopping:'쇼핑',activity:'놀거리',drink:'술',night:'야경',other:'기타'};
  const dates = ['2026-11-06','2026-11-07','2026-11-08'];
  const uid = () => globalThis.crypto?.randomUUID?.() || 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  const copy = x => JSON.parse(JSON.stringify(x));
  const fail = msg => { throw new Error(msg); };
  const need = (test,msg) => { if(!test) fail(msg); };
  const obj = x => x && typeof x === 'object' && !Array.isArray(x);
  const str = (x,max=500,required=false) => { need(typeof x==='string' && x.length<=max,'입력한 글의 형식 또는 길이를 확인해주세요.'); x=x.trim(); need(!required||x.length>0,'필수 항목을 입력해주세요.'); return x; };
  const num = (x,max) => { if(x===null||x==='') return null; need(typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=max,'비용 또는 시간의 범위를 확인해주세요.');return x; };
  const enumValue = (x,values) => { need(values.includes(x),'지원하지 않는 값이 포함되어 있어요.'); return x; };
  const iso = x => { need(typeof x==='string' && x.length<40 && Number.isFinite(Date.parse(x)),'날짜 형식이 올바르지 않아요.');return x; };
  const idStr = x => { x=str(x,80,true);need(/^[a-zA-Z0-9_-]+$/.test(x),'식별자 형식이 올바르지 않아요.');return x; };
  function safeUrl(raw,maps=false){
    raw=str(raw,2000); if(!raw) return '';
    let u; try{u=new URL(raw);}catch{fail('링크는 https://로 시작하는 전체 주소를 입력해주세요.');}
    need(['https:','http:'].includes(u.protocol)&&!u.username&&!u.password,'안전한 웹 주소만 입력할 수 있어요.');
    if(maps){
      const host=u.hostname.toLowerCase();
      const main=['google.com','www.google.com','maps.google.com','google.co.jp','www.google.co.jp','maps.google.co.jp','google.co.kr','www.google.co.kr','maps.google.co.kr'];
      need((host==='maps.app.goo.gl')||(host==='goo.gl'&&u.pathname.startsWith('/maps'))||(main.includes(host)&&(u.pathname.startsWith('/maps')||host.startsWith('maps.'))),'Google 지도에서 복사한 장소 링크를 입력해주세요.');
      need(u.protocol==='https:','지도 링크는 https:// 주소를 사용해주세요.');
    }
    return u.href;
  }
  function create(){
    return {version:1,updatedAt:new Date().toISOString(),participants:Array.from({length:5},(_,i)=>({id:'p'+(i+1),name:i?'여행자 '+(i+1):'지석'})),
      days:dates.map(id=>({id,status:'collect',locked:false,slots:SLOTS.map(s=>({id:s.id,enabled:true,start:s.start,end:s.end,confirmedId:null,rainId:null,transfer:''}))})),candidates:[],bookings:{flights:'',hotel:''}};
  }
  function validate(raw){
    need(obj(raw)&&raw.version===1,'이 보드에서 지원하는 백업 파일이 아니에요.');
    need(Array.isArray(raw.participants)&&raw.participants.length===5,'참여자는 정확히 5명이어야 해요.');
    const participants=raw.participants.map((p,i)=>{need(obj(p)&&p.id==='p'+(i+1),'참여자 정보가 올바르지 않아요.');return {id:p.id,name:str(p.name,24,true)};});
    need(new Set(participants.map(p=>p.name.toLocaleLowerCase())).size===5,'참여자의 이름은 서로 다르게 입력해주세요.');
    const pids=participants.map(p=>p.id);
    need(Array.isArray(raw.days)&&raw.days.length===3,'여행 날짜 정보가 올바르지 않아요.');
    const days=raw.days.map((d,i)=>{
      need(obj(d)&&d.id===dates[i]&&typeof d.locked==='boolean'&&Array.isArray(d.slots)&&d.slots.length===8,'하루 일정 정보가 올바르지 않아요.');
      return {id:d.id,status:enumValue(d.status,['collect','vote','final']),locked:d.locked,slots:d.slots.map((s,j)=>{
        need(obj(s)&&s.id===SLOTS[j].id&&typeof s.enabled==='boolean','시간대 정보가 올바르지 않아요.');
        need(/^([01]\d|2[0-3]):[0-5]\d$/.test(s.start)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s.end)&&s.start<s.end,'종료 시간은 시작 시간보다 늦어야 해요. 자정을 넘는 일정은 다음 날짜로 나눠주세요.');
        return {id:s.id,enabled:s.enabled,start:s.start,end:s.end,confirmedId:s.confirmedId===null?null:idStr(s.confirmedId),rainId:s.rainId===null?null:idStr(s.rainId),transfer:str(s.transfer,120)};
      })};
    });
    need(Array.isArray(raw.candidates)&&raw.candidates.length<=600,'후보는 최대 600개까지 저장할 수 있어요.');
    const members=a=>{need(Array.isArray(a)&&a.length<=5&&new Set(a).size===a.length&&a.every(x=>pids.includes(x)),'투표자 정보가 올바르지 않아요.');return [...a];};
    const allIds=new Set();
    const unique=x=>{x=idStr(x);need(!allIds.has(x),'중복된 데이터 ID가 있어요.');allIds.add(x);return x;};
    const candidates=raw.candidates.map(c=>{
      need(obj(c)&&dates.includes(c.dayId)&&SLOTS.some(s=>s.id===c.slotId),'후보의 날짜 또는 시간대가 올바르지 않아요.');
      need(pids.includes(c.authorId)&&typeof c.reservation==='boolean','제안자 정보가 올바르지 않아요.');
      need(Array.isArray(c.comments)&&c.comments.length<=200,'후보당 댓글은 최대 200개까지 저장할 수 있어요.');
      const lat=c.lat,lng=c.lng;
      need((lat===null&&lng===null)||(typeof lat==='number'&&typeof lng==='number'&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180),'위도와 경도를 모두 정확하게 입력해주세요.');
      return {id:unique(c.id),dayId:c.dayId,slotId:c.slotId,title:str(c.title,100,true),address:str(c.address,300),mapsUrl:safeUrl(c.mapsUrl,true),category:enumValue(c.category,Object.keys(CATEGORIES)),cost:num(c.cost,10000000),duration:num(c.duration,1440),reservation:c.reservation,weather:enumValue(c.weather,['any','indoor','outdoor']),description:str(c.description,2000),photoUrl:safeUrl(c.photoUrl),lat,lng,authorId:c.authorId,createdAt:iso(c.createdAt),votes:members(c.votes),picks:members(c.picks),comments:c.comments.map(m=>{need(obj(m)&&pids.includes(m.authorId),'댓글 작성자가 올바르지 않아요.');return {id:unique(m.id),authorId:m.authorId,text:str(m.text,500,true),createdAt:iso(m.createdAt)};})};
    });
    for(const d of days){
      for(const s of d.slots){
        for(const id of [s.confirmedId,s.rainId]) if(id)need(candidates.some(c=>c.id===id&&c.dayId===d.id&&c.slotId===s.id),'확정/대체 일정은 같은 날짜와 시간대의 후보여야 해요.');
        need(!s.rainId||s.confirmedId!==s.rainId,'확정 일정과 우천 대체 후보는 달라야 해요.');
      }
      const enabled=d.slots.filter(s=>s.enabled);
      if(d.status==='final')need(enabled.length>0&&enabled.every(s=>s.confirmedId),'사용하는 모든 시간대를 선택한 뒤 일정 확정 상태로 바꿔주세요.');
    }
    for(const p of pids)need(candidates.filter(c=>c.picks.includes(p)).length<=3,'꼭 가고 싶은 곳은 여행 전체에서 3개까지 선택할 수 있어요.');
    need(obj(raw.bookings),'예약 정보 형식이 올바르지 않아요.');
    return {version:1,updatedAt:iso(raw.updatedAt),participants,days,candidates,bookings:{flights:str(raw.bookings.flights,3000),hotel:str(raw.bookings.hotel,3000)}};
  }
  function change(state,a,actorId){
    const n=copy(state);need(n.participants.some(p=>p.id===actorId),'먼저 참여자를 선택해주세요.');
    const candidate=()=>{const c=n.candidates.find(c=>c.id===a.id);need(c,'후보를 찾을 수 없어요.');return c;};
    const day=id=>{const d=n.days.find(d=>d.id===id);need(d,'날짜를 찾을 수 없어요.');return d;};
    const unlocked=d=>need(!d.locked,'잠긴 일정이에요. 날짜 설정에서 잠금을 해제해주세요.');
    const slot=d=>{const s=d.slots.find(s=>s.id===a.slotId);need(s,'시간대를 찾을 수 없어요.');return s;};
    switch(a.type){
      case 'add':{
        const c=a.candidate;const d=day(c.dayId);unlocked(d);need(d.slots.some(s=>s.id===c.slotId&&s.enabled),'사용하지 않는 시간대에는 후보를 추가할 수 없어요.');
        n.candidates.push({...c,id:uid(),authorId:actorId,createdAt:new Date().toISOString(),votes:[],picks:[],comments:[]});break;
      }
      case 'edit':{const c=candidate();unlocked(day(c.dayId));need(c.authorId===actorId,'본인이 제안한 후보만 수정할 수 있어요.');const allowed=['title','address','mapsUrl','category','cost','duration','reservation','weather','description','photoUrl','lat','lng'];for(const key of allowed)if(Object.hasOwn(a.patch,key))c[key]=a.patch[key];break;}
      case 'delete':{const c=candidate();unlocked(day(c.dayId));need(c.authorId===actorId,'본인이 제안한 후보만 삭제할 수 있어요.');n.candidates=n.candidates.filter(x=>x.id!==c.id);for(const d of n.days)for(const s of d.slots){if(s.confirmedId===c.id)s.confirmedId=null;if(s.rainId===c.id)s.rainId=null;}break;}
      case 'vote':case 'pick':{const c=candidate();unlocked(day(c.dayId));const field=a.type==='vote'?'votes':'picks';if(c[field].includes(actorId))c[field]=c[field].filter(x=>x!==actorId);else{if(field==='picks')need(n.candidates.filter(x=>x.picks.includes(actorId)).length<3,'꼭 가고 싶은 곳은 여행 전체에서 3개까지 선택할 수 있어요.');c[field].push(actorId);}break;}
      case 'comment':{const c=candidate();unlocked(day(c.dayId));c.comments.push({id:uid(),authorId:actorId,text:str(a.text,500,true),createdAt:new Date().toISOString()});break;}
      case 'confirm':case 'rain':{const d=day(a.dayId);unlocked(d);const s=slot(d);need(s.enabled,'사용하지 않는 시간대예요.');if(a.id)need(n.candidates.some(c=>c.id===a.id&&c.dayId===d.id&&c.slotId===s.id),'같은 시간대의 후보를 선택해주세요.');if(a.type==='confirm'){s.confirmedId=a.id;if(s.rainId===a.id)s.rainId=null;}else{need(!a.id||a.id!==s.confirmedId,'확정 일정과 다른 대체 후보를 골라주세요.');s.rainId=a.id;}break;}
      case 'day':{const d=day(a.dayId);if(d.locked)need(Object.keys(a.patch).length===1&&a.patch.locked===false,'잠금을 먼저 해제해주세요.');for(const k of ['status','locked'])if(Object.hasOwn(a.patch,k))d[k]=a.patch[k];break;}

        try{const raw=JSON.stringify(state);localStorage.setItem(KEY,raw);savedRaw=raw;storageIssue='';}
        catch{storageIssue='저장 공간 부족 또는 브라우저 제한으로 자동 저장에 실패했어요. 닫기 전에 JSON 백업을 다운로드해주세요.';}

  function candidateResults(){const q=ui.query.trim().toLocaleLowerCase(),cs=state.candidates.filter(c=>(ui.filterDay==='all'||ui.filterDay===c.dayId)&&(ui.category==='all'||ui.category===c.category)&&(ui.weather==='all'||ui.weather===c.weather)&&(!q||[c.title,c.address,c.description,name(c.authorId)].join(' ').toLocaleLowerCase().includes(q))).sort((a,b)=>b.votes.length-a.votes.length||a.createdAt.localeCompare(b.createdAt));return cs.length?`<p class="field-help" style="margin-bottom:12px">후보 ${cs.length}개 · 표 수순 / 카드의 순위는 같은 날짜·시간대 기준이에요.</p><div class="candidates-grid">${cs.map(candidateTile).join('')}</div>`:`<div class="empty-state"><div class="empty-art">${icon('pin')}</div><h3>${state.candidates.length?'검색에 맞는 후보가 없어요':'아직 모아둔 곳이 없어요'}</h3><p>${state.candidates.length?'검색어나 필터를 바꿔서 다시 찾아보세요.':'괜찮아 보이는 곳을 발견하면, 여기에 남겨주세요.<br>작은 아이디어부터 시작해도 좋아요.'}</p>${state.candidates.length?btn('필터 초기화','clear-filters'):btn(icon('plus',true)+' 첫 후보 남기기','add','','primary')}</div>`;}
  function mine(){const votes=state.candidates.filter(c=>c.votes.includes(actor)),picks=state.candidates.filter(c=>c.picks.includes(actor)),own=state.candidates.filter(c=>c.authorId===actor);return `<div class="page-title"><div class="eyebrow muted">A TRIP THAT FEELS LIKE YOU</div><h1>내 마음이 향하는 곳</h1><p>투표와 PICK, 내가 제안한 아이디어를 한눈에.</p></div><div class="my-banner">${avatar(actor)}<div><h3>${e(name(actor))}님의 여행 취향</h3><p>여러 후보에 투표할 수 있어요. 같은 후보에는 한 표씩!</p></div><div class="pick-budget"><b>${picks.length}<span style="font-size:14px;opacity:.5"> / 3</span></b>나의 PICK</div></div><h2 class="list-heading">${icon('star')}꼭 가고 싶은 곳 <small>${picks.length}곳</small></h2>${picks.length?`<div class="candidates-grid">${picks.map(candidateTile).join('')}</div>`:'<div class="inline-empty">후보 카드의 ☆ PICK을 눌러보세요. 여행 전체에서 3곳까지!</div>'}<h2 class="list-heading">${icon('heart')}내가 투표한 곳 <small>${votes.length}곳</small></h2>${votes.length?`<div class="candidates-grid">${votes.map(candidateTile).join('')}</div>`:`<div class="empty-state"><div class="empty-art">${icon('heart')}</div><h3>마음에 드는 곳을 찾아볼까요?</h3><p>후보를 살펴보고, 함께 가고 싶은 곳에 투표해요.</p>${btn('후보 모아보기','navigate','data-view="candidates"')}</div>`}<h2 class="list-heading">${icon('plane')}내가 제안한 곳 <small>${own.length}곳</small></h2>${own.length?`<div class="candidates-grid">${own.map(candidateTile).join('')}</div>`:'<div class="inline-empty">나만 알고 있던 그곳, 첫 아이디어를 나눠주세요.</div>'}`;}
  function mapPage(){const route=M.route(state,ui.day,ui.mapMode),coords=route.filter(r=>r.candidate.lat!==null),missing=route.length-coords.length;return `<div class="page-title"><div class="eyebrow muted">CONNECT THE LITTLE MOMENTS</div><h1>한눈에 보는 우리의 동선</h1><p>가고 싶은 곳들 사이, 함께 걸어갈 길을 살펴봐요.</p></div>${dateBar()}<div class="map-controls"><div class="segmented" role="group" aria-label="지도에 표시할 후보"><button type="button" data-action="map-mode" data-mode="confirmed" class="${ui.mapMode==='confirmed'?'active':''}" aria-pressed="${ui.mapMode==='confirmed'}">확정 일정</button><button type="button" data-action="map-mode" data-mode="leaders" class="${ui.mapMode==='leaders'?'active':''}" aria-pressed="${ui.mapMode==='leaders'}">확정 + 상위 후보</button></div><select class="filter-select" id="travel-mode" aria-label="길찾기 교통수단"><option value="transit" ${ui.travelmode==='transit'?'selected':''}>대중교통</option><option value="walking" ${ui.travelmode==='walking'?'selected':''}>도보</option><option value="driving" ${ui.travelmode==='driving'?'selected':''}>자동차</option></select></div><div class="map-panel" id="trip-map"><div class="map-placeholder">${icon('map')}<p>${coords.length?'지도를 불러오고 있어요.':route.length?'장소 좌표를 추가하면 여기에 핀이 표시돼요.<br>아래 목록의 Google 지도 연결은 바로 사용할 수 있어요.':'아직 표시할 일정이 없어요.<br>후보를 확정하거나 상위 후보 보기를 선택해보세요.'}</p></div></div><p class="map-caption">지도는 OpenStreetMap을 사용해요. 연결선은 방문 순서이며 실제 도로·이동 경로가 아니에요. 이동시간은 아래 Google 길찾기에서 확인해주세요.${missing?`<br>좌표 미입력 ${missing}곳은 핀에서 제외되지만 일정 목록에는 표시돼요.`:''}${ui.mapMode==='leaders'?'<br>미확정 시간대는 1표 이상 받은 1위 후보를 표시해요. 공동 1위는 먼저 등록된 후보가 대표로 표시돼요.':''}</p><div class="routes">${route.map((r,i)=>`${i?`<div class="route-transfer">${icon('arrow')}${link(M.directionsUrl(route[i-1].candidate,r.candidate,ui.travelmode),'Google에서 이동시간 확인 '+icon('external'))}${r.slot.transfer?`<span>· 메모: ${e(r.slot.transfer)}</span>`:''}</div>`:''}<article class="route-card"><span class="route-num">${r.index}</span><div class="route-text"><small>${r.slot.start}–${r.slot.end}   function updateCandidateSlots(){const form=$('#candidate-form');if(!form)return;const d=state.days.find(d=>d.id===form.elements.dayId.value),select=form.elements.slotId;select.innerHTML=options(d.slots.filter(s=>s.enabled).map(s=>[s.id,slotMeta(s.id).label+' · '+s.start]),'');if(d.locked)showError('이 날짜는 잠겨 있어요. 시간대 설정에서 먼저 잠금을 해제해주세요.');else if(!d.slots.some(s=>s.enabled))showError('이 날짜에 사용할 시간대를 먼저 켜주세요.');else{const error=$('#panel-dialog .form-error');if(error)error.textContent='';}}
  function fillCoordinates(){const f=$('#candidate-form');if(!f)return;const coords=M.coordinates(f.elements.mapsUrl.value);if(coords){f.elements.lat.value=coords.lat;f.elements.lng.value=coords.lng;toast('지도 링크의 장소 좌표를 채웠어요.');}else if(modal?.kind==='edit'&&f.elements.mapsUrl.value!==byId(modal.id)?.mapsUrl){f.elements.lat.value='';f.elements.lng.value='';toast('지도 링크가 바뀌어 이전 좌표를 지웠어요. 필요하면 새 장소의 좌표를 입력해주세요.');}}
  function revisionCheck(formKind){if(!demo&&modal&&modal.revision!==savedRaw&&['participants','day','bookings','candidate'].includes(formKind))throw new Error('이 화면을 연 뒤 다른 변경이 있었어요. 닫고 다시 열어 최신 내용을 확인해주세요.');}
  document.addEventListener('submit',event=>{
    const f=event.target;if(!(f instanceof HTMLFormElement)||!f.dataset.form)return;event.preventDefault();
    try{
      if(!f.reportValidity())return;
      revisionCheck(f.dataset.form);
      const fd=new FormData(f),value=k=>String(fd.get(k)??''),number=k=>value(k).trim()===''?null:Number(value(k));
      if(f.dataset.form==='join'){connectRemote(value('token'));return;}
      if(f.dataset.form==='candidate'){
        const id=value('id'),old=byId(id),dId=old?.dayId||value('dayId'),slotId=old?.slotId||value('slotId'),coords=M.coordinates(value('mapsUrl'));
        const c={dayId:dId,slotId,title:value('title'),address:value('address'),mapsUrl:value('mapsUrl'),category:value('category'),weather:value('weather'),description:value('description'),photoUrl:value('photoUrl'),cost:number('cost'),duration:number('duration'),reservation:fd.has('reservation'),lat:number('lat'),lng:number('lng')};
        if(c.lat===null&&c.lng===null&&coords){c.lat=coords.lat;c.lng=coords.lng;}
        if(commit(id?{type:'edit',id,patch:c}:{type:'add',candidate:c},id?'후보를 수정했어요.':'새로운 아이디어를 남겼어요.')){ui.day=dId;ui.expanded.add(slotId);closeModal();render();}
      }else if(f.dataset.form==='participants'){
        if(commit({type:'participants',names:state.participants.map(p=>value(p.id)||p.name)},'함께 가는 사람들의 이름을 저장했어요.'))openModal('settings');
      }else if(f.dataset.form==='bookings'){
        if(commit({type:'bookings',patch:{flights:value('flights'),hotel:value('hotel')}},'예약 정보를 저장했어요.'))closeModal();
      }else if(f.dataset.form==='day'){
        const d=day(),changes=d.slots.map(s=>({type:'slot',dayId:d.id,slotId:s.id,patch:{enabled:fd.has('enabled-'+s.id),start:value('start-'+s.id),end:value('end-'+s.id),transfer:value('transfer-'+s.id)}}));
        changes.push({type:'day',dayId:d.id,patch:{status:value('status')}});
        if(event.submitter?.value==='lock')changes.push({type:'day',dayId:d.id,patch:{locked:true}});
        if(commit(changes,event.submitter?.value==='lock'?'시간대 설정을 저장하고 날짜를 잠갔어요.':'시간대 설정을 저장했어요.'))closeModal();
      }else if(f.dataset.form==='comment'){
        if(commit({type:'comment',id:value('id'),text:value('text')},'의견을 남겼어요.'))refreshDetail(false);
      }
    }catch(err){showError(err.message||'입력 내용을 확인해주세요.');}
  });
  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
    const a=el.dataset.action,id=el.dataset.id;
    try{
      if(a==='navigate')navigate(el.dataset.view);
      else if(a==='date'){ui.day=el.dataset.day;ui.expanded.clear();ui.more.clear();render();}
      else if(a==='slot-toggle'){const s=el.dataset.slot;ui.expanded.has(s)?ui.expanded.delete(s):ui.expanded.add(s);render();}
      else if(a==='add'){if(day().locked)return toast('잠긴 날짜예요. 시간대 설정에서 잠금을 해제해주세요.');if(!day().slots.some(s=>s.enabled)){openModal('day');return toast('사용할 시간대를 먼저 켜주세요.');}openModal('add',{slotId:el.dataset.slot});}
      else if(['settings','participants','day','bookings'].includes(a))withDiscard(()=>openModal(a));
      else if(a==='detail')openModal('detail',{id});
      else if(a==='edit')withDiscard(()=>openModal('edit',{id}));
      else if(a==='close-modal')requestClose();
      else if(a==='select-person')setActor(el.dataset.person);
      else if(a==='vote'||a==='pick'){if(commit({type:a,id},a==='vote'?'투표를 반영했어요.':'나의 PICK을 반영했어요.'))refreshDetail();}
      else if(a==='confirm'||a==='rain'){
        const c=byId(id);if(!c)return;const d=state.days.find(d=>d.id===c.dayId),s=d.slots.find(s=>s.id===c.slotId),current=a==='confirm'?s.confirmedId:s.rainId,isClear=current===id;
        const next=isClear?null:id,previous=byId(current);
        ask(a==='confirm'?(isClear?'일정 확정을 해제할까요?':'이 일정으로 확정할까요?'):(isClear?'우천 대체를 해제할까요?':'비 오는 날의 대안으로 정할까요?'),isClear?'후보와 투표는 그대로 남아 있어요.':`${c.title}\n${previous?'기존 선택 ‘'+previous.title+'’ 대신 이 후보로 바뀌어요.':'투표 결과와 관계없이 이 후보가 선택돼요.'}`,()=>{if(commit({type:a,id:next,dayId:d.id,slotId:s.id},isClear?'선택을 해제했어요.':'우리의 선택을 저장했어요.'))refreshDetail();},{label:isClear?'해제하기':'선택하기'});
      }else if(a==='delete'){
        const c=byId(id);if(!c)return;ask('이 후보를 삭제할까요?',`‘${c.title}’의 투표와 댓글도 함께 삭제돼요. 확정·우천 대체로 선택된 경우 해당 선택도 해제돼요.`,()=>{if(commit({type:'delete',id},'후보를 삭제했어요.'))closeModal();},{label:'후보 삭제',danger:true});
      }else if(a==='unlock')ask('날짜 잠금을 해제할까요?','후보 등록·투표·댓글·최종 일정 변경이 다시 가능해져요.',()=>{if(commit({type:'day',dayId:ui.day,patch:{locked:false}},'잠금을 해제했어요.'))openModal('day');},{label:'잠금 해제'});
      else if(a==='category'){ui.category=el.dataset.category;render();}
      else if(a==='clear-filters'){ui.query='';ui.category='all';ui.filterDay='all';ui.weather='all';render();}
      else if(a==='map-mode'){ui.mapMode=el.dataset.mode;render();}
      else if(a==='map-search'||a==='generate-link'){
        const f=$('#candidate-form'),title=f?.elements.title.value.trim();if(!title)return showError('장소명을 먼저 입력해주세요.');
        const url=M.searchUrl(title,f.elements.address.value.trim());
        if(a==='map-search')window.open(url,'_blank','noopener,noreferrer');
        else{f.elements.mapsUrl.value=url;modal.dirty=true;fillCoordinates();toast('장소명으로 검색하는 지도 링크를 넣었어요. 정확한 장소의 공유 링크로 바꿀 수도 있어요.');}
      }else if(a==='export')backup();
      else if(a==='retry-sync'){remoteError='';bootRemote();}
      else if(a==='disconnect'){
        ask('이 기기의 연결을 해제할까요?','공용 보드 데이터는 삭제되지 않아요. 다시 들어오려면 이 참여자의 초대 코드가 필요합니다.',()=>{R.clearToken();remoteReady=false;remoteError='';actor='p1';closeModal();render();},{label:'연결 해제'});
      }
      else if(a==='export-corrupt'){downloadJSON(corruptRaw,'osaka-trip-recovery-original.json');toast('보관 중인 오류 원본의 다운로드를 요청했어요.');}
      else if(a==='demo')withDiscard(enterDemo);
      else if(a==='exit-demo')withDiscard(exitDemo);
      else if(a==='reset'){
        const expected=savedRaw;ask('보드를 처음 상태로 되돌릴까요?',`${demo?'샘플':'현재 브라우저의'} 후보·투표·댓글·예약 메모가 모두 삭제돼요. 되돌릴 수 없으니 필요한 내용은 JSON으로 백업해주세요.`,()=>{if(replacement(M.create(),expected))toast('빈 보드로 초기화했어요.');},{label:'모두 초기화',danger:true});
      }else if(a==='cancel-confirm'){$('#confirm-dialog').close();confirmHandler=null;}
      else if(a==='accept-confirm'){const fn=confirmHandler;confirmHandler=null;$('#confirm-dialog').close();fn?.();}
    }catch(err){showError(err.message||'이 작업을 완료하지 못했어요.');}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='candidate-search'){ui.query=event.target.value;$('#candidate-results').innerHTML=candidateResults();}
    if(event.target.closest('#panel-dialog form')&&modal)modal.dirty=true;
  });
  document.addEventListener('change',event=>{
    const t=event.target;
    if(t.id==='filter-day'){ui.filterDay=t.value;$('#candidate-results').innerHTML=candidateResults();}
    else if(t.id==='filter-weather'){ui.weather=t.value;$('#candidate-results').innerHTML=candidateResults();}
    else if(t.id==='travel-mode'){ui.travelmode=t.value;render();}
    else if(t.id==='candidate-day')updateCandidateSlots();
    else if(t.id==='candidate-maps')fillCoordinates();
    else if(t.id==='import-file')importFile(t.files[0]);
    if(t.closest('#panel-dialog form')&&modal)modal.dirty=true;
  });
  document.addEventListener('toggle',event=>{const target=event.target;if(target.matches?.('details[data-more]'))target.open?ui.more.add(target.dataset.more):ui.more.delete(target.dataset.more);},true);
  document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement){event.target.removeAttribute('src');event.target.hidden=true;}},true);
  $('#panel-dialog').addEventListener('cancel',event=>{event.preventDefault();requestClose();});
  $('#panel-dialog').addEventListener('click',event=>{if(event.target===$('#panel-dialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)requestClose();}});
  $('#confirm-dialog').addEventListener('cancel',()=>{confirmHandler=null;});
  window.addEventListener('storage',event=>{
    if(event.key!==KEY||demo)return;
    if(storageIssue){toast('다른 탭에서 변경이 있었어요. 이 화면의 저장되지 않은 내용을 먼저 백업해주세요.');return;}
    try{state=event.newValue?M.validate(JSON.parse(event.newValue)):M.create();savedRaw=event.newValue;render();if(modal?.kind==='detail')refreshDetail();toast('같은 브라우저의 다른 탭에서 수정한 내용을 반영했어요.');}
    catch{storageIssue='다른 탭의 저장 데이터에 오류가 있어요. 현재 화면을 JSON으로 백업한 후 확인해주세요.';render();}
  });
  window.addEventListener('beforeunload',event=>{if(modal?.dirty||storageIssue&&!corruptRaw){event.preventDefault();event.returnValue='';}});
  async function loadLeaflet(){
    if(globalThis.L)return globalThis.L;
    if(leafletPromise)return leafletPromise;
    leafletPromise=new Promise((resolve,reject)=>{
      if(!$('#leaflet-css')){const css=document.createElement('link');css.id='leaflet-css';css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';css.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';css.crossOrigin='anonymous';document.head.append(css);}
      const script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';script.crossOrigin='anonymous';
      const timer=setTimeout(()=>{script.remove();reject(new Error('지도 로딩 시간이 초과되었어요.'));},12000);
      script.onload=()=>{clearTimeout(timer);globalThis.L?resolve(globalThis.L):reject(new Error('지도 모듈을 불러오지 못했어요.'));};
      script.onerror=()=>{clearTimeout(timer);script.remove();reject(new Error('인터넷 연결 또는 지도 제공 서버를 확인해주세요.'));};document.head.append(script);
    }).catch(err=>{leafletPromise=null;throw err;});return leafletPromise;
  }
  async function initMap(serial){
    const route=M.route(state,ui.day,ui.mapMode),pins=route.filter(r=>r.candidate.lat!==null);if(!pins.length)return;
    try{
      const L=await loadLeaflet();if(serial!==renderSerial||ui.view!=='map'||!$('#trip-map'))return;
      const host=$('#trip-map');host.innerHTML='';mapInstance=L.map(host,{scrollWheelZoom:false}).setView([pins[0].candidate.lat,pins[0].candidate.lng],13);
      const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'}).addTo(mapInstance);
      let tileErrors=0;tiles.on('tileerror',()=>{if(++tileErrors===3)toast('배경 지도 일부를 불러오지 못했어요. 인터넷 연결을 확인해주세요.');});
      const points=[];
      for(const r of pins){const c=r.candidate,point=[c.lat,c.lng];points.push(point);const popup=document.createElement('div'),title=document.createElement('strong');title.textContent=r.index+'. '+c.title;popup.append(title,document.createElement('br'));const a=document.createElement('a');a.href=c.mapsUrl||M.searchUrl(c.title,c.address);a.textContent='Google 지도에서 보기';a.target='_blank';a.rel='noopener noreferrer';popup.append(a);L.marker(point,{icon:L.divIcon({html:`<span class="map-pin">${r.index}</span>`,className:'',iconSize:[28,28],iconAnchor:[14,14]}),title:c.title}).addTo(mapInstance).bindPopup(popup);}
      // Never join across missing coordinates: a skipped venue would hide a detour.
      for(let i=1;i<route.length;i++){const a=route[i-1].candidate,b=route[i].candidate;if(a.lat!==null&&b.lat!==null)L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#0064ff',weight:3,dashArray:'5 8',opacity:.7}).addTo(mapInstance);}
      if(points.length>1)mapInstance.fitBounds(L.latLngBounds(points),{padding:[35,35],maxZoom:15});mapInstance.invalidateSize();
    }catch(err){if(serial!==renderSerial||!$('#trip-map'))return;$('#trip-map').innerHTML=`<div class="map-placeholder">${icon('map')}<p>배경 지도를 불러오지 못했어요.<br>${e(err.message)}<br>아래 일정 목록과 Google 지도 링크는 그대로 사용할 수 있어요.</p></div>`;}
  }
  if(remoteMode)bootRemote();else render();
})();
</script>
